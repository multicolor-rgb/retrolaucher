[package]
name = "retro-launcher"
version = "2.1.0"
description = "Retro game launcher with gamepad support and emulator integration"
authors = ["Gramodrana <gramodrana1@gmail.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
evdev = "0.13"

[profile.release]
strip = true
lto = true
codegen-units = 1
