<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Brak okładki / No cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121724"/>
      <stop offset="0.55" stop-color="#0a0d16"/>
      <stop offset="1" stop-color="#161d2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e0ff"/>
      <stop offset="1" stop-color="#8c78ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.58">
      <stop offset="0" stop-color="#38e0ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#38e0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8fa4c8" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#grid)" opacity="0.07"/>
  <rect width="600" height="800" fill="url(#glow)"/>
  <rect x="16" y="16" width="568" height="768" rx="22" fill="none" stroke="#38e0ff" stroke-opacity="0.22" stroke-width="2"/>

  <text x="300" y="372" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="6" fill="#eef1f8">BRAK OKŁADKI</text>
  <text x="300" y="414" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="19" letter-spacing="5" fill="#7f90ab">NO COVER</text>

  <rect x="228" y="456" width="144" height="2" rx="1" fill="url(#accent)" opacity="0.7"/>

  <text x="300" y="710" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="6" fill="#4f5f7a">RETRO LAUNCHER</text>
</svg>
