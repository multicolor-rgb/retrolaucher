name: Release

on:
  push:
    tags:
      - 'rel/*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  build-linux:
    name: Linux (.deb + .AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build Tauri bundles
        run: npm run tauri build -- --bundles deb,appimage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  build-windows:
    name: Windows (.exe / NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build Tauri bundles
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          if-no-files-found: error
          path: src-tauri/target/release/bundle/nsis/*.exe

  publish:
    name: Publish GitHub release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/rel/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect bundles and generate checksums
        run: |
          mkdir -p release
          find dist -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' \) \
            -exec cp {} release/ \;
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Retro Launcher 2.1.1
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Retro Launcher 2.1.1 — bugfix release.

            - Fixed returning to the launcher after closing a game (application
              state was never registered, so the launcher aborted on launch).
            - Gamepad stop combo (L3 + R3 + LB + RB) now works for the whole
              game session and survives pad reconnects.
            - Stop shortcut unified between the UI and the renderer.

            - **Linux:** `.deb` (Debian / Ubuntu / Mint) and portable `.AppImage`
            - **Windows:** NSIS installer (WebView2 handled automatically)
            - Existing 1.x/2.1 configuration in `~/.config/retro-launcher` is preserved.
          files: |
            release/*
